# Raspberry Pi 1 (Model B, B+, A+, also the first Pi Zero): OpenWrt profile rpi (bcm27xx/bcm2708).
# build.sh reads this file when a line of profiles.txt names "rpi" in its profile column.
# Status: NOT YET TESTED (written 2026-11-28, after a Pi 1 nest+feeder booted with no Wi-Fi and no /home).

# No radio on the board: no feeder, no flyway, no join. It is a wired unit (a nest on the village
# cable, next to a feeder). A USB Wi-Fi dongle would need its driver here and a test first.
CAN2=''
CAN5=''

# The name and the village address come from the Ethernet MAC (eth0, b8:27:eb:...)
MACDEV='eth0'

# A nest keeps messages (lxmd) and files: a 1 GB root partition, as on the Pi 4. The system partitions
# end at 1092 MiB (4 MiB gap + 64 MiB boot + ROOTFS_MB).
ROOTFS_MB='1024'

# Where the locked /home starts on the card, in MiB (Sparrows Tao, "Kept data: a locked /home"). The
# same as every Pi: a card moves between Pi models and keeps its /home. NEVER change it once units are out.
# RAM: 512 MB (B rev 2, B+) is fine. 256 MB (A, A+, B rev 1) is tight for Reticulum and for /home's
# setup (its key derivation uses 128 MB): not advised.
HOME_START_MB='2048'
