# Radxa ZERO 3W: OpenWrt profile radxa_zero-3w (rockchip/armv8). build.sh reads this file when a line
# of profiles.txt names "radxa_zero-3w" in its profile column.
# Status: NOT YET TESTED (written 2026-11-28: the board booted from its eMMC but nothing could reach it).

# No radio under OpenWrt: its Wi-Fi chip (AIC8800 on today's boards) has no driver in OpenWrt, whose
# image for it carries only USB network drivers. A wired unit: a tree on the village cable.
CAN2=''
CAN5=''

# No Ethernet on the board: the village cable goes into a USB Ethernet adapter on its USB host port
# (USB-C). Drivers for the common adapters, as on the Pi Zero 2 W:
#   cdc-ether = generic, rtl8152 = Realtek RTL8152/8153, asix = AX88772, asix-ax88179 = AX88179
DEV_PACKAGES='kmod-usb-net-cdc-ether kmod-usb-net-rtl8152 kmod-usb-net-asix kmod-usb-net-asix-ax88179'

# The board has no fixed MAC: the name (tree-xxxx) and the address come from the adapter's, so they
# change if the adapter is swapped.
MACDEV='eth0'

# No locked /home yet: it boots from an eMMC or an SD card, and sparrows-home is only tested on Pi
# cards. To add once tested (Sparrows Tao, "Kept data: a locked /home"):
# HOME_START_MB='2048'
